services:
  postgres:
    image: postgres:17-alpine
    container_name: task-management-postgres
    environment:
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
      POSTGRES_DB: task_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: task-management-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-management-api
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      POSTGRES_DSN: postgres://task_user:task_password@postgres:5432/task_management?sslmode=disable
      POSTGRES_MAX_CONNS: "10"
      POSTGRES_MIN_CONNS: "2"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      # Loaded from the root .env file by Docker Compose. Never commit its value.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_TTL: 24h
      MIGRATIONS_PATH: /app/db/migrations
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
